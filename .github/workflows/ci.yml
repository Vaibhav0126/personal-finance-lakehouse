name: CI/CD

# test     -> every push and PR: unit tests (pure-Python + local Spark)
# validate -> PRs: the bundle resolves against the real workspace
# deploy   -> merge to main: deploy the bundle to the prod target
#
# Required repository secrets:
#   DATABRICKS_HOST   e.g. https://<your-workspace>.cloud.databricks.com
#   DATABRICKS_TOKEN  personal access token, or swap to a service principal
#                     (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET) if
#                     your workspace supports it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  validate:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
